<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Deep Obsidian Cosmic Gradient matching PQCanary dark UI -->
    <radialGradient id="bgGrad" cx="30%" cy="40%" r="85%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="55%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#040404" />
    </radialGradient>

    <!-- Amber Glow Gradient -->
    <radialGradient id="canaryGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#F59E0B" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0c0a09" stop-opacity="0" />
    </radialGradient>

    <!-- Gold Accent Linear Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Emerald Accent Linear Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

