apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: pqcanary-node-agent
  namespace: pqcanary
  labels:
    app.kubernetes.io/name: pqcanary
    app.kubernetes.io/component: node-agent
    app.kubernetes.io/part-of: pqcanary-security-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pqcanary
      app.kubernetes.io/component: node-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pqcanary
        app.kubernetes.io/component: node-agent
    spec:
      hostPID: true
      hostNetwork: false
      tolerations:
        - operator: Exists
          effect: NoSchedule
        - operator: Exists
          effect: NoExecute
      containers:
        - name: node-auditor
          image: pqcanary/pqcanary:latest
          imagePullPolicy: IfNotPresent
          command:
            - "/app/pqcanary"
            - "daemon"
            - "--mode"
            - "k8s-agent"
            - "--mesh-endpoint"
            - "http://pqcanary-service.pqcanary.svc.cluster.local:8080"
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SCAN_INTERVAL_SECONDS
              value: "60"
            - name: RUST_LOG
              value: "info,pqcanary=debug"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            capabilities:
              drop:
                - ALL
              add:
                - SYS_PTRACE
                - DAC_READ_SEARCH
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-etc-ssl
              mountPath: /host/etc/ssl
              readOnly: true
            - name: host-etc-pki
              mountPath: /host/etc/pki
              readOnly: true
            - name: containerd-sock
              mountPath: /run/containerd/containerd.sock
              readOnly: true
            - name: tmp-scratch
              mountPath: /tmp
      volumes:
        - name: host-proc
          hostPath:
            path: /proc
        - name: host-etc-ssl
          hostPath:
            path: /etc/ssl
        - name: host-etc-pki
          hostPath:
            path: /etc/pki
        - name: containerd-sock
          hostPath:
            path: /run/containerd/containerd.sock
        - name: tmp-scratch
          emptyDir: {}
