[package]
name = "pqcanary-cli"
version = "0.1.0"
edition = "2021"
description = "PQCanary CLI — post-quantum cryptographic security scanner for CI/CD pipelines"
authors = ["Matvei Igumnov"]
license = "Apache-2.0"

[[bin]]
name = "pqcanary"
path = "src/main.rs"

[dependencies]
pqcanary-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "color"] }
tokio = { version = "1.36", features = ["full"] }
indicatif = "0.17"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
regex = "1.10"
