[package]
name = "pqcanary-mcp"
version = "0.1.0"
edition = "2021"
description = "PQCanary Model Context Protocol (MCP) Server — exposes PQCanary engines to AI agents"
authors = ["Matvei Igumnov"]
license = "Apache-2.0"

[[bin]]
name = "pqcanary-mcp"
path = "src/main.rs"

[dependencies]
pqcanary-core = { path = "../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
